development_policy: correct mathematical/interface/implementation failures before
  freeze; preserve every epoch; no evaluation tuning
heldout_policy: final research seeds 0-9 and 100-119 remain unused
methods:
- predictive
- reactive_qp
comparison_scope: component diagnostic with shared speed cap and scene; adaptive predictive
  versus bounded reactive progress; no final research superiority claim
execution_mode: paused_simulation_reference
reference_guard: Planner computation occurs with the local simulator paused; independently
  re-read unchanged initial q/v, then enforce unchanged 50ms current-command/fallback
  guard. Not a hardware/online result.
precision_policy: Development numeric stopping eps_abs1e-8/eps_rel1e-9. Unchanged
  nativeSOLVED-only and original SI1e-7 posterior hard-row acceptance plus original
  nonlinear/command/history/geometry checks. No failed/inaccurate candidate may command.
  Online protocol50ms and original online tolerances unchanged.
qp_formulation: lifted
qp_variable_scaling: true
reference_budget_policy: Paused functional reference5s/50000 with nativeSolved-only
  and unchanged originalSI/hard/nonlinear checks. Online50ms/4000 unchanged. Earlieriteration/inaccurate
  outcomes retained.
tracking_model_tolerance_m: 0.0001
sigma_model_tolerance: 1.0e-06
scp_convergence: Feasible iterate acceptance by local scaled-SE3 model agreement at100micrometres,
  small control step, or max iteration ceiling; not nonlinear convergence or stationarity.
completion_position_m: 0.01
completion_rotation_rad: 0.05
model_accuracy_policy: Optimization-model termination precision is1% of declared10mm
  task position tolerance (100micrometres in scaled SE3 residual), independently from
  unchanged original-QP1e-7 and nonlinear hard-bound1e-6 acceptance. Active sigma
  model tolerance remains1e-6. Earlier10micrometre convergence failures retained.
reference_iteration_policy: Single convexified coupled horizon solve plus all original-bound/nonlinear
  checks; not claimed nonlinear convergence. This independent reference isolates receding-horizon/warmstart
  behavior.3pass old references retained.
dual_feedback_policy: Approximate same-node semantic dual seed across4ms feedback,
  no exact fractional costate shift claimed. Primal controls still shift/reconstruct
  by actual4ms; full new QP/true nonlinear validation mandatory. Solver/stale/nonlinear
  rejection/projected intervention/invalid seed resets workspace.
diagnostic_protocol: Same physical plant, limits, native-SOLVED-only, SI1e-7 acceptance,
  and 50ms current-command guard. Only declared development objective tracking weight
  and mathematically equivalent QP formulation change.
forecast_semantics: Kinematic commanded-acceleration forecast from measured q/v; actual
  persistent position-servo response is independently observed. No validated plant-prediction
  claim or physical model/interface change.
progress_cache_projection_threshold: 1.0e-09
progress_cache_policy: Actual execution always clips to shared finite-jerk continuation
  interval. Only cache invalidation distinguishes tiny/material projection at1e-9
  acceleration units. Material projection prevents later recaching; numerical-only
  projection keeps validated warm seed with first b replaced by actual applied b.
  Failure/model changes retain reset policy.
