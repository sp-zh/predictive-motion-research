name: Linux simulation, kinematics and control tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ros:jazzy-ros-base-noble@sha256:066420e07f60aa18262f2479981def87ebcfcec42eefb0c0c57c4a46098348ca
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: checkout
        with:
          persist-credentials: false
      - name: Install selected dependencies
        shell: bash
        run: bash scripts/phase0/setup_linux.sh
      - name: Check CI failure controls
        shell: bash
        run: python3 tests/ci/test_environment_check.py
      - name: Fetch locked models, compile and execute tests
        shell: bash
        run: |
          mkdir -p results/ci-images
          bash scripts/ci.sh 2>&1 | tee results/ci-images/full-ci.log
      - name: Verify complete original test inventory
        shell: bash
        run: python3 scripts/ci/verify_test_results.py
      - name: Record environment
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        env:
          CI_IMAGE_REFERENCE: ros:jazzy-ros-base-noble@sha256:066420e07f60aa18262f2479981def87ebcfcec42eefb0c0c57c4a46098348ca
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 scripts/collect_environment.py --output results/phase0/environment.json
      - name: Preserve explicit CI diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/ci-images/full-ci.log
            results/ci-images/test-inventory.json
            results/phase0/*.log
            results/phase0/environment.json
            results/phase1/*.log
            results/phase1/numerical/**
            build/**/test_results/**/*.xml
            log/latest_build/**
            log/latest_test/**
          if-no-files-found: warn
          retention-days: 30
